[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-equity-momentum"
version = "0.1.0"
description = "Transaction-cost-aware cross-sectional equity momentum research"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "requests>=2.31",
  "statsmodels>=0.14",
  "yfinance>=0.2.66,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
momentum-backtest = "quant_momentum.cli:main"
momentum-fetch = "quant_momentum.fetch:main"
momentum-fill-tiingo = "quant_momentum.tiingo:main"
momentum-optimize = "quant_momentum.optimize:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

strategy:
  lookback_months: 12
  skip_months: 1
  quantile: 0.10
  max_positions: 30
  long_only: false
  rebalance_months: 1
costs:
  one_way_bps: 10
  annual_short_borrow_bps: 30
evaluation:
  annualization_factor: 12
  risk_free_annual_rate: 0.00
optimization:
  train_start: "2015-02-28"
  train_end: "2022-12-31"
  objective: "net_sharpe"
  grid:
    lookback_months: [6, 9, 12]
    skip_months: [1]
    max_positions: [10, 20, 30]
    rebalance_months: [1, 3]
data:
  price_file: "data/raw/prices.csv"
  yahoo_price_file: "data/raw/prices_yahoo.csv"
  tiingo_cache_dir: "data/raw/tiingo"
  tiingo_remaining_file: "data/processed/tiingo_remaining.csv"
  unresolved_ticker_audit_file: "data/processed/unresolved_ticker_audit.csv"
  legacy_identity_override_file: "data/processed/legacy_identity_overrides.csv"
  ticker_alias_file: "data/processed/ticker_aliases.csv"
  alias_canonical_price_file: "data/raw/alias_canonical_yahoo.csv"
  price_source_file: "data/processed/price_sources.csv"
  membership_file: "data/processed/annual_membership.csv"
  membership_coverage_file: "data/processed/membership_coverage.csv"
  membership_history_file: "data/raw/sp500_historical_components.csv"
  price_column: "adjusted_close"
  source: "yfinance_tiingo"
  start: "1999-01-01"
  portfolio_start_year: 2000
  end: "2026-11-01"
  universe_mode: "annual_lagged_sp500"
  membership_history_url: "https://raw.githubusercontent.com/fja05680/sp500/master/S%26P%20500%20Historical%20Components%20%26%20Changes%20%28Updated%29.csv"
  tiingo:
    token_environment_variable: "TIINGO_API_TOKEN"
    max_symbols_per_run: 50
